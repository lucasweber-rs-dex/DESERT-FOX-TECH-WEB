<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa Fire Stick</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --sand:#e2ded7; --paper:#efefef; --ink:#1e1e1e; --fox:#ff5e00; --red:#e3001b; }
  * { box-sizing:border-box; margin:0; }
  html, body { width:1500px; height:1000px; overflow:hidden; }
  body { font-family:'Manrope', system-ui, sans-serif; -webkit-font-smoothing:antialiased; position:relative;
    background:radial-gradient(620px 620px at 76% 46%, rgba(227,0,27,.55), transparent 70%),
               radial-gradient(900px 500px at 76% 110%, rgba(255,94,0,.45), transparent 70%), #120a0a; }
  .rays { position:absolute; left:1140px; top:460px; width:2400px; height:2400px; transform:translate(-50%,-50%);
    background:repeating-conic-gradient(rgba(255,94,0,.10) 0 6deg, transparent 6deg 18deg);
    -webkit-mask-image:radial-gradient(circle, #000 10%, transparent 45%); mask-image:radial-gradient(circle, #000 10%, transparent 45%); }

  .txt { position:absolute; left:90px; top:90px; width:820px; color:var(--paper); }
  .alert { display:inline-flex; align-items:center; gap:14px; height:58px; padding:0 22px; background:var(--red); color:#fff;
    font-size:28px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; transform:rotate(-2deg); }
  .alert i { width:14px; height:14px; border-radius:50%; background:#fff; display:block; animation:none; }
  .kick { margin-top:38px; font-size:46px; font-weight:800; letter-spacing:-.02em; color:var(--fox); text-transform:uppercase; }
  h1 { margin-top:6px; font-size:150px; line-height:.86; font-weight:800; letter-spacing:-.055em; text-transform:uppercase; }
  h1 s { text-decoration:none; position:relative; color:var(--sand); opacity:.55; }
  h1 s::after { content:''; position:absolute; left:-12px; right:-12px; top:52%; height:16px; background:var(--red); transform:rotate(-4deg); }
  h1 em { font-style:normal; color:var(--red); text-shadow:0 0 40px rgba(227,0,27,.6); }
  .sub { margin-top:30px; font-size:38px; line-height:1.15; font-weight:700; color:var(--paper); max-width:640px; text-wrap:balance; }
  .sub b { color:var(--fox); }

  .art { position:absolute; left:1140px; top:470px; transform:translate(-50%,-50%) rotate(12deg); }

  .tape { position:absolute; left:-40px; right:-40px; bottom:70px; height:84px; transform:rotate(-3deg);
    background:repeating-linear-gradient(-45deg, var(--fox) 0 34px, var(--ink) 34px 68px);
    display:grid; place-items:center; box-shadow:0 20px 40px rgba(0,0,0,.5); }
  .tape span { background:var(--ink); color:var(--fox); padding:6px 28px; font-size:36px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="rays"></div>

  <div class="txt">
    <span class="alert"><i></i>Traição!</span>
    <p class="kick">Fire Stick:</p>
    <h1><s>Herói</s><br>a <em>vilão</em></h1>
    <p class="sub">Amazon <b>tranca a porta</b> e o pauzinho que era queridinho do povo vira as costas.</p>
  </div>

  <svg class="art" width="520" height="820" viewBox="0 0 520 820">
    <defs>
      <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#1a1a1a"/><stop offset=".55" stop-color="#3a3a3a"/><stop offset="1" stop-color="#151515"/>
      </linearGradient>
      <radialGradient id="eye" cx=".5" cy=".5" r=".5">
        <stop offset="0" stop-color="#fff6d6"/><stop offset=".35" stop-color="#ffb000"/><stop offset="1" stop-color="#e3001b"/>
      </radialGradient>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    </defs>
    <!-- auréola de herói, quebrada -->
    <g fill="none" stroke="#f2c14e" stroke-width="16" stroke-linecap="round" opacity=".9">
      <path d="M150 70 A110 34 0 0 1 250 36"/>
      <path d="M290 38 A110 34 0 0 1 372 70 A110 34 0 0 1 330 100"/>
    </g>
    <!-- chifres -->
    <path d="M150 210 C 120 150, 110 110, 140 70 C 150 120, 175 160, 200 190 Z" fill="#e3001b"/>
    <path d="M370 210 C 400 150, 410 110, 380 70 C 370 120, 345 160, 320 190 Z" fill="#e3001b"/>
    <!-- conector HDMI -->
    <rect x="205" y="110" width="110" height="80" rx="10" fill="#9a9a9a"/>
    <rect x="222" y="128" width="76" height="30" rx="4" fill="#4a4a4a"/>
    <!-- corpo do stick -->
    <rect x="130" y="180" width="260" height="600" rx="46" fill="url(#body)" stroke="#000" stroke-width="4"/>
    <rect x="148" y="196" width="40" height="560" rx="20" fill="#fff" opacity=".06"/>
    <!-- sobrancelhas -->
    <path d="M160 300 L250 345" stroke="#000" stroke-width="22" stroke-linecap="round"/>
    <path d="M360 300 L270 345" stroke="#000" stroke-width="22" stroke-linecap="round"/>
    <!-- olhos brilhando -->
    <ellipse cx="208" cy="372" rx="34" ry="24" fill="#ff2a00" filter="url(#glow)"/>
    <ellipse cx="312" cy="372" rx="34" ry="24" fill="#ff2a00" filter="url(#glow)"/>
    <path d="M176 362 Q208 342 240 372 Q208 396 176 362 Z" fill="url(#eye)"/>
    <path d="M344 362 Q312 342 280 372 Q312 396 344 362 Z" fill="url(#eye)"/>
    <!-- sorriso malvado -->
    <path d="M168 450 Q260 560 352 450 Q260 500 168 450 Z" fill="#0b0b0b" stroke="#000" stroke-width="4"/>
    <path d="M190 462 L205 492 L222 474 L240 500 L260 480 L280 500 L298 474 L315 492 L330 462 Q260 492 190 462 Z" fill="#f4f1ea"/>
    <!-- cadeado no peito -->
    <g transform="translate(220 590)">
      <path d="M14 34 V20 a26 26 0 0 1 52 0 V34" fill="none" stroke="#ff5e00" stroke-width="10"/>
      <rect x="0" y="32" width="80" height="62" rx="10" fill="#ff5e00"/>
      <circle cx="40" cy="58" r="9" fill="#1e1e1e"/><rect x="36" y="60" width="8" height="18" rx="3" fill="#1e1e1e"/>
    </g>
    <!-- LED -->
    <circle cx="260" cy="740" r="8" fill="#ff2a00"/><circle cx="260" cy="740" r="16" fill="#ff2a00" opacity=".35" filter="url(#glow)"/>
  </svg>

  <div class="tape"><span>⚠ Apps de fora bloqueados ⚠</span></div>
</body>
</html>
